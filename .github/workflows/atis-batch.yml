name: Fetch ATIS batch

on:
  workflow_dispatch:
  schedule:
    # 兜底：GitHub 自带定时不可靠，主力由 cron-job.org 每 10 分钟触发
    - cron: "*/10 * * * *"

concurrency:
  group: fetch-atis-batch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch common airports ATIS and publish
        env:
          ATIS_CODES: "ZGGG,ZGSZ,ZUCK,ZSPD,PANC,KJFK,KORD,KLAX,KMIA,EHAM"
          GIST_TOKEN: ${{ secrets.FID_GIST_TOKEN }}
          GIST_ID: ${{ secrets.FID_GIST_ID }}
        run: python3 scripts/fetch_atis.py
