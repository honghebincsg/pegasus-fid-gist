name: Fetch ATIS ZGGG

on:
  workflow_dispatch:
    inputs:
      airport:
        description: "ICAO airport code (4 letters)"
        required: true
        default: "ZGGG"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch ATIS and publish
        env:
          ATIS_CODE: ${{ inputs.airport }}
          GIST_TOKEN: ${{ secrets.FID_GIST_TOKEN }}
          GIST_ID: ${{ secrets.FID_GIST_ID }}
        run: python3 scripts/fetch_atis.py
