name: Fetch ATIS ZGGG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ATIS
        env:
          ATIS_URL: https://atis.guru/atis/ZGGG
          GIST_TOKEN: ${{ secrets.FID_GIST_TOKEN }}
          GIST_ID: ${{ secrets.FID_GIST_ID }}
        run: python scripts/fetch_atis.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atis
          path: out/
          retention-days: 1
          if-no-files-found: ignore
