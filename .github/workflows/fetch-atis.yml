name: Fetch ATIS ZGGG

on:
  workflow_dispatch:
    inputs:
      airport:
        description: "ICAO airport code (4 letters)"
        required: true
        default: "ZGGG"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch ATIS and publish
        env:
          ATIS_CODE: ${{ inputs.airport }}
          GIST_TOKEN: ${{ secrets.FID_GIST_TOKEN }}
          GIST_ID: ${{ secrets.FID_GIST_ID }}
        run: |
          curl -fsSL -m 15 "https://raw.githubusercontent.com/honghebincsg/pegasus-fid-gist/main/scripts/fetch_atis.py" -o /tmp/fetch_atis.py
          python3 /tmp/fetch_atis.py
